name: "Fetch JFrog OIDC token"
description: >
  Exchanges the GitHub Actions OIDC token for a JFrog access token and exports
  JFROG_ACCESS_TOKEN to the workflow environment. Subsequent steps in the same
  job can read it from $JFROG_ACCESS_TOKEN to configure pip/uv/npm against
  databricks.jfrog.io.

runs:
  using: composite
  steps:
    - name: Get JFrog OIDC token
      shell: bash
      run: |
        set -euo pipefail
        # GitHub issues no OIDC token to pull_request runs from forks (nor to
        # jobs without `id-token: write`), so JFrog auth cannot work. Fail with
        # an explanation instead of an "unbound variable" error.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            MSG="CI cannot install dependencies for pull requests from forks: GitHub issues no OIDC token to them, so JFrog auth is impossible. After reviewing the code, a maintainer can run CI with: scripts/fork-sync-pr.sh ${{ github.event.pull_request.number }} <reviewed-sha> (see CONTRIBUTING.md)."
          else
            MSG="No GitHub OIDC token available. Grant the job 'permissions: id-token: write'."
          fi
          echo "::error title=JFrog auth unavailable::${MSG}"
          echo "### JFrog auth unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        ID_TOKEN=$(curl -sLS \
          -H "User-Agent: actions/oidc-client" \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jfrog-github" | jq .value | tr -d '"')
        echo "::add-mask::${ID_TOKEN}"
        ACCESS_TOKEN=$(curl -sLS -XPOST -H "Content-Type: application/json" \
          "https://databricks.jfrog.io/access/api/v1/oidc/token" \
          -d "{\"grant_type\": \"urn:ietf:params:oauth:grant-type:token-exchange\", \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\", \"subject_token\": \"${ID_TOKEN}\", \"provider_name\": \"github-actions\"}" | jq .access_token | tr -d '"')
        echo "::add-mask::${ACCESS_TOKEN}"
        if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
          echo "FAIL: Could not extract JFrog access token"
          exit 1
        fi
        echo "JFROG_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"
        echo "JFrog OIDC token obtained successfully"
