      - url: https://example.com/p-id-q-lib/def
        type: businessDefinition
        description: p-id-q-lib ad description
        id: p-id-q-lib-ad-0
      type: library
      metric: nullValues
      arguments:
        properties:
        - a
        - b
      mustBeLessOrEqualTo: 0
    - id: p-id-q-lib2
      name: p-id-q-lib2 name
      description: p-id-q-lib2 description
      dimension: completeness
      method: reconciliation
      schedule: 0 0 * * *
      scheduler: cron
      severity: error
      businessImpact: operational
