# See https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# and https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Feature Request
description: Something new needs to happen with Ontos
title: '[FEATURE]: '
labels: feature,needs-triage
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature request you're willing to submit
      options:
      - label: I have searched the existing issues
        required: true
  - type: textarea
    attributes:
      label: Problem statement
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context, references or screenshots about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Are you willing to submit a PR?
      description: "Not required, but we are happy to guide you through the contribution. See [CONTRIBUTING.md](https://github.com/databrickslabs/ontos/blob/development/CONTRIBUTING.md); [CI for pull requests from forks](https://github.com/databrickslabs/ontos/blob/development/CONTRIBUTING.md#ci-for-pull-requests-from-forks) is started by a maintainer."
      options:
        - label: Yes, I am willing to submit a PR!
