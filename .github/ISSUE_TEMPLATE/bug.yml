name: Bug Report
title: '[BUG]: '
description: Create a report to help us improve
labels: bug,needs-triage
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
      - label: I have searched the existing issues
        required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: |
        A concise description of what you're experiencing.
        **Do not paste links to attachments with logs and/or images, as all issues with attachments will get deleted.**
        Use the `Relevant log output` field to paste redacted log output without personal identifying information (PII).
        You can Ctrl/Cmd+V the screenshot, which would appear as a rendered image if it doesn't contain any PII.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        1. With this config...
        1. Run '...'
        1. See error...
    validations:
      required: false
  - type: dropdown
    id: cloud
    attributes:
      label: Cloud
      description: What cloud are you using?
      options:
        - AWS
        - Azure
        - GCP
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Edge
        - Other
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - latest
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: contribute
    attributes:
      label: Are you willing to submit a PR?
      description: "Not required, but we are happy to guide you through the contribution. See [CONTRIBUTING.md](https://github.com/databrickslabs/ontos/blob/development/CONTRIBUTING.md); [CI for pull requests from forks](https://github.com/databrickslabs/ontos/blob/development/CONTRIBUTING.md#ci-for-pull-requests-from-forks) is started by a maintainer."
      options:
        - label: Yes, I am willing to submit a PR!
