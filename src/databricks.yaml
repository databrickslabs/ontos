bundle:
  name: ontos

variables:
  sql_warehouse_id:
    description: "ID of the SQL warehouse to use"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  catalog_name:
    description: "Name of the catalog to use"
    default: "app_data"
  schema_name:
    description: "Name of the schema to use"
    default: "app_ontos"
  volume_name:
    description: "Name of the volume to use"
    default: "app_files"
  test_user_token_secret_scope:
    description: "Secret scope holding the TEST_USER_TOKEN that enables per-request user impersonation (test personas)."
    default: "ontos"
  test_user_token_secret_key:
    description: "Secret key within the scope for the TEST_USER_TOKEN value."
    default: "test_user_token"
  lakebase_database:
    description: "Ontos Lakebase project path"
    default: "projects/ontos-instance/branches/production/databases/databricks-postgres"
  lakebase_branch:
    description: "Ontos branch"
    default: "projects/ontos-instance/branches/production"
  app_config:
    type: complex
    description: "Configuration for Ontos"
    default:
      command:
        - python
        - backend/src/app.py
      env:
        - name: ENV
          value: DEV
        - name: APP_DEMO_MODE
          value: "false"
        - name: APP_DB_DROP_ON_START
          value: "true"
        - name: PYTHONPATH
          value: ./backend
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: FRONTEND_STATIC_DIR
          value: ./static
        - name: PGSCHEMA
          value: ${var.schema_name}
        - name: DATABRICKS_CATALOG
          value: ${var.catalog_name}
        - name: DATABRICKS_SCHEMA
          value: ${var.schema_name}
        - name: DATABRICKS_WAREHOUSE_ID
          value_from: sql-warehouse
        - name: DATABRICKS_VOLUME
          value_from: volume
        - name: POSTGRES_HOST
          value_from: database
        - name: APP_ADMIN_DEFAULT_GROUPS
          value: '["admins"]'
        - name: APP_AUDIT_LOG_DIR
          value: audit_logs
        - name: LLM_ENABLED
          value: "True"
        - name: "TEST_USER_TOKEN"
          value_from: "test-user-token"
      #  - name: LLM_ENDPOINT
      #    value_from: serving-endpoint

resources:
  apps:
    ontos:
      name: "ontos"
      description: "ontos"
      source_code_path: "."
      config: ${var.app_config}
      resources:
        - name: database
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: "sql-warehouse"
          description: "SQL warehouse for the app"
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: "CAN_USE"
        - name: volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog_name}.${var.schema_name}.${var.volume_name}
            permission: READ_VOLUME
        # Supplies the TEST_USER_TOKEN value referenced by `valueFrom` in app.yaml.
        # Remove this resource (and the app.yaml env entry) to keep impersonation OFF.
        - name: "test-user-token"
          secret:
            scope: ${var.test_user_token_secret_scope}
            key: ${var.test_user_token_secret_key}
            permission: "READ"
      permissions:
        - user_name: "*"
          level: "CAN_USE"

targets:
  dev:
    variables:
      catalog_name: "app_data_dev"
      schema_name: "ontos_app"
      volume_name: "app_files"
      lakebase_branch: projects/ontos-instance/branches/production
      lakebase_database: projects/ontos-instance/branches/production/databases/databricks-postgres
  prod:
    variables:
      catalog_name: "app_data_prod"
      schema_name: "ontos_app"
      volume_name: "app_files"
