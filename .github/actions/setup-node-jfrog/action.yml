name: "Set up Node with JFrog npm"
description: >
  Fetches a JFrog OIDC token, writes ~/.npmrc to authenticate against
  databricks.jfrog.io npm, then sets up Node with npm caching. npm rewrites
  the registry host of resolved URLs at install time (replace-registry-host
  defaults to "npmjs"), so package-lock.json needs no rewriting.

inputs:
  node-version:
    description: "Node version (e.g., '24')"
    required: true
  lock-path:
    description: "Path to the package-lock.json that npm caching should target"
    required: false
    default: ./src/frontend/package-lock.json

runs:
  using: composite
  steps:
    - uses: ./.github/actions/jfrog-auth

    - name: Configure npm via JFrog
      shell: bash
      run: |
        set -euo pipefail
        cat > ~/.npmrc << EOF
        registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
        //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${JFROG_ACCESS_TOKEN}
        always-auth=true
        EOF
        echo "npm configured to use JFrog registry"

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.lock-path }}
