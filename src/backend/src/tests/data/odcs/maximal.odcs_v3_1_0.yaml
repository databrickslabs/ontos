      description: p-id cp description
      id: p-id-cp-0
    - property: p-idCpNum
      value: 42
      id: p-id-cp-1
    - property: p-idCpObj
      value:
        nested:
        - 1
        - two
      id: p-id-cp-2
    logicalType: string
    physicalName: order_id_col
    required: true
    unique: true
    primaryKey: true
    partitioned: true
    classification: confidential
    encryptedName: order_id_enc
    transformSourceObjects:
    - src.table_a
    - src.table_b
    transformLogic: SELECT order_id FROM src
    transformDescription: order_id transform
    examples:
    - ex1
    - ex2
    criticalDataElement: true
    quality:
    - id: p-id-q-lib
      name: p-id-q-lib name
      description: p-id-q-lib description
      dimension: completeness
      method: reconciliation
      schedule: 0 0 * * *
      scheduler: cron
      severity: error
      businessImpact: operational
      unit: rows
      tags:
      - p-id-q-lib-tag
      customProperties:
      - property: p-id-q-libCpStr
        value: p-id-q-lib-cp-value
        description: p-id-q-lib cp description
        id: p-id-q-lib-cp-0
