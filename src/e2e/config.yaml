# E2E Test Configuration
# Copy this file to config.local.yaml and adjust values for your environment.
# config.local.yaml is gitignored and will override these defaults.

# The base URL of the deployed Ontos application to test against.
# For Databricks Apps: https://<app-name>-<workspace-id>.<cloud>.databricksapps.com
# For local development: http://localhost:8000
base_url: "http://localhost:8000"

# Databricks authentication settings (used to obtain an OAuth token via the CLI).
databricks:
  host: "https://e2-demo-field-eng.cloud.databricks.com"
  profile: "DEFAULT"

# Persona-specific auth for CUJ tests (ONT-CUJ-*, ONT-RBAC-*, etc.).
# Each persona maps to a Databricks workspace user assigned to the corresponding
# Ontos role: admin = a group from the app's APP_ADMIN_DEFAULT_GROUPS (`admins` by
# default) or a user in the Admin role's assigned users; producer, steward and
# consumer = the groups data-producers, data-stewards, data-consumers.
#
# The demo-data CUJ tests (test_CUJ_003_load_retail_demo_data,
# test_NEG_016_demo_data_idempotent) need the admin persona (or the default identity
# when it is not configured) to have the settings-general ADMIN permission, i.e. the
# Admin role; otherwise the load route answers 403 (CUJ_003 fails, NEG_016 loads
# nothing and checks nothing). The e2e sessions do not send
# the X-Demo-Setup-Token header, so the app's DEMO_SETUP_TOKEN does not help them.
#
# Priority order: token > profile > fall back to default 'databricks' settings above.
# In config.local.yaml set token or profile for each persona you have provisioned.
# If a persona is not configured, CUJ tests that require it run under the default
# (admin) identity; RBAC tests that require a DISTINCT user are skipped.
personas:
  admin:
    profile: ""   # e.g. "fevm-ontos-v1-test"
    token: ""     # PAT takes precedence over profile
  producer:
    profile: ""
    token: ""
  steward:
    profile: ""
    token: ""
  consumer:
    profile: ""
    token: ""

# Google Sheets reporter — writes Pass/Fail/Blocked back to the CUJ tracking sheet
# after each pytest session.  Set enabled: true and supply your local gcloud token
# via `gcloud auth application-default login` (the reporter calls
# `gcloud auth application-default print-access-token`).
sheet_reporter:
  enabled: false
  spreadsheet_id: "1kkj8d_drDxFa3DPr0dBjTOmqlNuIRqmuDBNdzc8fY-I"
  quota_project: "gcp-dev-field-eng-aiapiquota"
